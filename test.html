<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Inspeção GLBs Zumbi</title>
  <style>
    body { margin:0; background:#111; color:#eee; font-family:monospace; padding:20px; font-size:13px; line-height:1.5; }
    h2 { color:#0f0; margin-bottom:10px; }
    .glb { margin:16px 0; padding:12px; background:#1a1a1a; border-left:4px solid #0af; }
    .glb.ok { border-left-color:#0f0; }
    .glb.err { border-left-color:#f00; }
    .glb h3 { margin:0 0 8px; color:#ffdd00; font-size:14px; }
    .glb .line { color:#aaa; }
    .glb .line b { color:#fff; }
    .glb .tag { display:inline-block; padding:1px 6px; margin-right:4px; border-radius:3px; font-size:11px; }
    .glb .tag-yes { background:#0a4a0a; color:#4f4; }
    .glb .tag-no { background:#4a0a0a; color:#f44; }
    .glb .tag-warn { background:#4a3a0a; color:#fd0; }
    #done { color:#0f0; font-size:16px; margin-top:20px; font-weight:bold; }
  </style>
</head>
<body>
  <h2>🔬 Análise dos GLBs de Zumbi</h2>
  <div id="out">Iniciando análise...</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const out = document.getElementById('out');
    out.innerHTML = '';

    const BASE = 'assets/models/';
    const LIST = [
      'WorkerZombie.glb',
      'MinerZombie.glb',
      'CombatantZombieMesh1.glb',
      'ZbGuyMesh.glb',
      'ZombieLowLOD.glb',
      'WorkerZombieLeftArm.glb',
      'WorkerZombieRightArm.glb',
      'WorkerZombieLeftLeg.glb',
      'WorkerZombieRightLeg.glb',
      'WorkerZombieCap.glb',
      'ZombieDoll.glb',
      'RiotZombie.glb',
      'ReaperZombie.glb',
      'QueenZombie.glb',
    ];

    const loader = new GLTFLoader();

    async function analyze(file) {
      const el = document.createElement('div');
      el.className = 'glb';
      el.innerHTML = `<h3>📁 ${file}</h3><div class="line">⏳ Carregando...</div>`;
      out.appendChild(el);

      try {
        const gltf = await loader.loadAsync(BASE + file);
        const scene = gltf.scene;

        let meshes = 0, skinned = 0, bones = 0;
        const meshNames = [];
        const boneNames = [];

        scene.traverse(c => {
          if (c.isMesh) {
            meshes++;
            if (c.isSkinnedMesh) skinned++;
            if (meshNames.length < 12) meshNames.push(c.name || '(sem nome)');
          }
          if (c.isBone) {
            bones++;
            if (boneNames.length < 8) boneNames.push(c.name);
          }
        });

        const box = new THREE.Box3().setFromObject(scene);
        const size = box.getSize(new THREE.Vector3());
        const minY = box.min.y;
        const anims = gltf.animations || [];

        const tags = [];
        if (meshes === 0) tags.push(`<span class="tag tag-no">SEM MESH</span>`);
        if (meshes > 1) tags.push(`<span class="tag tag-yes">PEÇAS SEPARADAS</span>`);
        if (meshes === 1 && skinned === 0) tags.push(`<span class="tag tag-warn">MESH ÚNICA</span>`);
        if (skinned > 0) tags.push(`<span class="tag tag-yes">SKINNED</span>`);
        if (bones > 0) tags.push(`<span class="tag tag-yes">${bones} BONES</span>`);
        if (anims.length > 0) tags.push(`<span class="tag tag-yes">${anims.length} ANIMS</span>`);
        if (anims.length === 0) tags.push(`<span class="tag tag-warn">SEM ANIM</span>`);
        if (minY > -0.1 && minY < 0.1) tags.push(`<span class="tag tag-yes">NA ORIGEM</span>`);
        else tags.push(`<span class="tag tag-warn">DESLOCADO Y=${minY.toFixed(2)}</span>`);

        let html = `<h3>📁 ${file} ${tags.join(' ')}</h3>`;
        html += `<div class="line"><b>Meshes:</b> ${meshes} · <b>Skinned:</b> ${skinned} · <b>Bones:</b> ${bones} · <b>Animações:</b> ${anims.length}</div>`;
        html += `<div class="line"><b>Tamanho:</b> ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} m</div>`;
        html += `<div class="line"><b>Min Y:</b> ${minY.toFixed(3)}</div>`;
        if (meshNames.length) html += `<div class="line"><b>Meshes:</b> ${meshNames.join(', ')}</div>`;
        if (boneNames.length) html += `<div class="line"><b>Bones:</b> ${boneNames.join(', ')}</div>`;
        if (anims.length) html += `<div class="line"><b>Clipes:</b> ${anims.map(a => a.name).join(', ')}</div>`;

        el.className = 'glb ok';
        el.innerHTML = html;

        return { file, meshes, skinned, bones, anims: anims.length, size: size.y };
      } catch (e) {
        el.className = 'glb err';
        el.innerHTML = `<h3>📁 ${file} ❌</h3><div class="line">Erro: ${e.message || e}</div>`;
        return { file, error: e.message || String(e) };
      }
    }

    (async () => {
      const results = [];
      for (const file of LIST) {
        results.push(await analyze(file));
      }

      // Resumo no final
      const done = document.createElement('div');
      done.id = 'done';
      const ok = results.filter(r => !r.error).length;
      done.textContent = `✅ Análise completa — ${ok}/${LIST.length} carregaram`;
      out.appendChild(done);

      // Tabela resumo no console
      console.log('═══════════════ RESUMO ═══════════════');
      console.table(results.map(r => ({
        arquivo: r.file,
        meshes: r.meshes ?? '❌',
        skinned: r.skinned ?? '-',
        bones: r.bones ?? '-',
        anims: r.anims ?? '-',
        altura: r.size ? r.size.toFixed(2) + 'm' : '-',
      })));
    })();
  </script>
</body>
</html>
