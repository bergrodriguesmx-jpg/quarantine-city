<!DOCTYPE html>
<html>
<head>
    <title>404 - Página não encontrada</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #111;
            color: #f1f1f1;
            text-align: center;
            padding: 40px;
            user-select: none;
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            color: #e11d48;
            text-shadow: 2px 2px 0 #000;
        }
        p {
            font-size: 1.2rem;
            color: #aaa;
            margin: 10px 0 30px;
        }
        a {
            color: #4ade80;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #4ade80;
            padding: 10px 24px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        a:hover {
            background: #4ade80;
            color: #111;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>O recurso que você está procurando não foi encontrado.</p>
    <a href="/">Voltar ao início</a>
</body>
</html>
